version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://sehatkita.test/api/v1}
      NEXT_PUBLIC_APP_NAME: Sehatkita
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: laradock-workspace:latest
    container_name: sehatkita-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      CACHE_STORE: failover
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sehatkita_redis_dev}
      SANCTUM_EXPIRATION: 1440
    depends_on:
      - redis
    restart: unless-stopped
    # Optional: mount backend volume
    # volumes:
    #   - ./backend:/var/www/backend

  redis:
    image: redis:7-alpine
    container_name: sehatkita-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sehatkita_redis_dev}"]
    ports:
      - "6379:6379"
    restart: unless-stopped
