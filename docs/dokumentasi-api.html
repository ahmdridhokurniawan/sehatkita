                  <span class="pill">${refByCount} relasi masuk</span>
                </div>
              </button>
            `;
          }).join("")}
        </div>
      `;

      let inspectorBody = "";
      if (state.schemaTab === "columns") {
        inspectorBody = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Kolom</th><th>Tipe SQL</th><th>Kunci</th><th>Null / Default</th><th>Keterangan</th></tr>
              </thead>
              <tbody>
                ${activeTbl.cols.map((c) => {
                  const fkTarget = c.fk ? c.fk.split(".")[0] : "";
                  return `
                    <tr>
                      <td><code>${escapeHtml(c.name)}</code></td>
                      <td><code class="inline-code">${escapeHtml(c.type)}</code></td>
                      <td>
                        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                          ${c.pk ? '<span class="k-badge k-pk">PK</span>' : ""}
                          ${c.fk ? `<button type="button" class="fk-jump-btn" data-select-table="${escapeHtml(fkTarget)}" title="Lompat ke tabel ${escapeHtml(fkTarget)}">FK &rarr; ${escapeHtml(c.fk)}</button>` : ""}
                          ${c.uk ? '<span class="k-badge k-uk">UK</span>' : ""}
                          ${c.idx ? '<span class="k-badge k-idx">IDX</span>' : ""}
                        </div>
                      </td>
                      <td style="font-size:12px;">
                        ${c.nn ? '<span style="color:var(--danger);font-weight:700;">NOT NULL</span>' : '<span style="color:var(--text-3);">NULL</span>'}
                        ${c.def !== undefined ? `<div class="mono" style="font-size:11px;color:var(--text-2);">def: ${escapeHtml(c.def)}</div>` : ""}
                      </td>
                      <td style="font-size:12.5px;color:var(--text-2);">${formatRichText(c.note)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (state.schemaTab === "relations") {
        inspectorBody = `
          <div class="rel-grid">
            <div>
              <h3 style="margin:0 0 10px;font-size:13.5px;">Mengacu ke Tabel Lain / Outgoing FK (${outEdges.length})</h3>
              ${outEdges.length ? outEdges.map((e) => `
                <div class="rel-item" style="margin-bottom:8px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                    <span class="mono" style="font-size:12px;"><code>${escapeHtml(activeTbl.name)}.${escapeHtml(e.fromCol)}</code> &rarr;</span>
                    <button type="button" class="fk-jump-btn" data-select-table="${escapeHtml(e.to)}">${escapeHtml(e.to)}.${escapeHtml(e.toCol)}</button>
                  </div>
                  <div style="font-size:11.5px;color:var(--text-3);">Aturan hapus: <code class="inline-code">ON DELETE ${escapeHtml(e.onDelete)}</code></div>
                </div>
              `).join("") : '<p style="font-size:13px;color:var(--text-3);">Tabel ini tidak memiliki Foreign Key ke tabel lain.</p>'}
            </div>
            <div>
              <h3 style="margin:0 0 10px;font-size:13.5px;">Diacu oleh Tabel Lain / Incoming FK (${inEdges.length})</h3>
              ${inEdges.length ? inEdges.map((e) => `
                <div class="rel-item" style="margin-bottom:8px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                    <button type="button" class="fk-jump-btn" data-select-table="${escapeHtml(e.from)}">${escapeHtml(e.from)}.${escapeHtml(e.fromCol)}</button>
                    <span class="mono" style="font-size:12px;">&rarr; <code>${escapeHtml(activeTbl.name)}.${escapeHtml(e.toCol)}</code></span>
                  </div>
                  <div style="font-size:11.5px;color:var(--text-3);">Aturan hapus: <code class="inline-code">ON DELETE ${escapeHtml(e.onDelete)}</code></div>
                </div>
              `).join("") : '<p style="font-size:13px;color:var(--text-3);">Belum ada tabel lain yang mengacu ke tabel ini.</p>'}
            </div>
          </div>
        `;
      } else {
        inspectorBody = `
          <div class="code-box" style="border:none;border-radius:0;">
            <div class="code-toolbar">
              <span>DDL MySQL / MariaDB — ${escapeHtml(activeTbl.name)}</span>
              <button type="button" class="copy-btn-mini" id="copyTableSqlBtn">Salin SQL</button>
            </div>
            <pre class="code-pre" id="tableSqlPre">${escapeHtml(buildTableSql(activeTbl))}</pre>
          </div>
        `;
      }

      const activeCl = SCHEMA_CLUSTERS[activeTbl.cluster];

      return `
        <div class="schema-stats">
          <div class="stat-card">
            <div class="stat-num">${DB_SCHEMA.length} Tabel</div>
            <div class="stat-lbl">23 domain + <code>personal_access_tokens</code></div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${totalCols} Kolom</div>
            <div class="stat-lbl">Hasil audit seluruh file migrasi Laravel</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${edges.length} Relasi FK</div>
            <div class="stat-lbl">Lengkap dengan CASCADE, RESTRICT &amp; SET NULL</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">MySQL + Redis</div>
            <div class="stat-lbl">MySQL/MariaDB prod, SQLite test, Redis sesi/cache</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:14px;">
          <div class="card-body" style="padding:14px 16px;">
            <div class="schema-toolbar" style="margin-bottom:10px;">
              <div class="schema-filters">
                <button type="button" class="btn ${state.schemaCluster === "all" ? "btn-primary" : ""}" data-schema-cluster="all">Semua (${DB_SCHEMA.length})</button>
                ${Object.entries(SCHEMA_CLUSTERS).map(([k, m]) => `
                  <button type="button" class="btn ${state.schemaCluster === k ? "btn-primary" : ""}" data-schema-cluster="${k}">
                    <span class="cluster-dot ${m.cls}" style="background:var(--cl)"></span>
                    ${escapeHtml(m.label.split(",")[0])}
                  </button>
                `).join("")}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button type="button" class="btn ${state.schemaMode === "erd" ? "btn-primary" : ""}" data-schema-mode="erd">Kanvas ERD</button>
                <button type="button" class="btn ${state.schemaMode === "grid" ? "btn-primary" : ""}" data-schema-mode="grid">Katalog Tabel</button>
                <button type="button" class="btn" id="copyMermaidBtn" title="Salin diagram ERD format Mermaid">Salin Mermaid ERD</button>
              </div>
            </div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              <input type="search" class="input" id="schemaSearchInput" value="${escapeHtml(state.schemaSearch)}" placeholder="Cari tabel atau kolom (mis. nik, wilayah_id, perlu_verifikasi, DECIMAL)..." style="flex:1;min-width:240px;" aria-label="Cari tabel atau kolom database" />
              <select class="input mono" id="quickTableSelect" style="width:240px;" aria-label="Pilih cepat tabel">
                ${DB_SCHEMA.map((t) => `<option value="${escapeHtml(t.name)}" ${t.name === activeTbl.name ? "selected" : ""}>${escapeHtml(t.name)} (${t.cols.length})</option>`).join("")}
              </select>
            </div>
          </div>
        </div>

        ${filteredTables.length ? (state.schemaMode === "erd" ? renderErdCanvas() : renderCatalogGrid()) : '<div class="card"><div class="card-body">Tidak ada tabel atau kolom yang cocok dengan pencarian.</div></div>'}

        <section class="card schema-inspector" aria-label="Inspector Detail Tabel">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <span class="mono" style="font-size:17px;font-weight:800;">${escapeHtml(activeTbl.name)}</span>
              <span class="cluster-pill ${activeCl.cls}">${escapeHtml(activeCl.label)}</span>
              ${activeTbl.cols.some((c) => c.name === "deleted_at") ? '<span class="pill">SoftDeletes</span>' : ""}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <span class="pill">${activeTbl.cols.length} kolom</span>
              <span class="pill">${outEdges.length} FK keluar</span>
              <span class="pill">${inEdges.length} FK masuk</span>
            </div>
          </div>
          <div style="padding:12px 18px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text-2);background:var(--bg);">
            ${formatRichText(activeTbl.desc)}
          </div>
          <div class="tabs" role="tablist">
            <button type="button" class="tab-btn ${state.schemaTab === "columns" ? "active" : ""}" data-schema-tab="columns">Struktur Kolom (${activeTbl.cols.length})</button>
            <button type="button" class="tab-btn ${state.schemaTab === "relations" ? "active" : ""}" data-schema-tab="relations">Relasi Foreign Key (${outEdges.length + inEdges.length})</button>
            <button type="button" class="tab-btn ${state.schemaTab === "sql" ? "active" : ""}" data-schema-tab="sql">SQL DDL (MySQL)</button>
          </div>
          ${inspectorBody}
        </section>
      `;
    }

    function bindSchemaEvents() {
      document.querySelectorAll("[data-schema-cluster]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.schemaCluster = btn.dataset.schemaCluster;
          renderMain();
        });
      });

      document.querySelectorAll("[data-schema-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.schemaMode = btn.dataset.schemaMode;
          renderMain();
        });
      });

      document.querySelectorAll("[data-schema-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.schemaTab = btn.dataset.schemaTab;
          renderMain();
        });
      });

      document.querySelectorAll("[data-select-table]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeTable = btn.dataset.selectTable;
          renderMain();
        });
      });

      $("#quickTableSelect")?.addEventListener("change", (e) => {
        state.activeTable = e.target.value;
        renderMain();
      });

      $("#schemaSearchInput")?.addEventListener("input", (e) => {
        const pos = e.target.selectionStart;
        state.schemaSearch = e.target.value;
        renderMain();
        const nextInput = $("#schemaSearchInput");
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(pos, pos);
        }
      });

      $("#zoomInBtn")?.addEventListener("click", () => {
        state.erdZoom = Math.min(1.4, +(state.erdZoom + 0.1).toFixed(2));
        renderMain();
      });
      $("#zoomOutBtn")?.addEventListener("click", () => {
        state.erdZoom = Math.max(0.55, +(state.erdZoom - 0.1).toFixed(2));
        renderMain();
      });
      $("#zoomResetBtn")?.addEventListener("click", () => {
        state.erdZoom = 1;
        renderMain();
      });
      $("#toggleEdgesBtn")?.addEventListener("click", () => {
        state.showAllEdges = !state.showAllEdges;
        renderMain();
      });

      $("#copyTableSqlBtn")?.addEventListener("click", (e) => {
        copyText($("#tableSqlPre").textContent, e.currentTarget);
      });
      $("#copyMermaidBtn")?.addEventListener("click", (e) => {
        copyText(buildMermaidErd(), e.currentTarget);
      });

      const vp = $("#erdViewport");
      if (vp) {
        vp.scrollLeft = state.erdScrollLeft || 0;
        vp.scrollTop = state.erdScrollTop || 0;
        vp.addEventListener("scroll", () => {
          state.erdScrollLeft = vp.scrollLeft;
          state.erdScrollTop = vp.scrollTop;
        });

        let dragging = false;
        let sx = 0, sy = 0, sl = 0, st = 0;
        vp.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) return;
          dragging = true;
          sx = e.clientX;
          sy = e.clientY;
          sl = vp.scrollLeft;
          st = vp.scrollTop;
          window.addEventListener("mouseup", () => { dragging = false; }, { once: true });
        });
        vp.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          vp.scrollLeft = sl - (e.clientX - sx);
          vp.scrollTop = st - (e.clientY - sy);
        });
      }
    }

    function getActiveFlow() {
      return API_FLOWCHARTS.find((f) => f.id === state.activeFlowId) || API_FLOWCHARTS[0];
    }

    function buildMermaidFlowchart(flow) {
      const shape = (n) => {
        const lbl = `${n.title}\\n${n.sub}`.replace(/"/g, "'");
        if (n.kind === "start" || n.kind === "end" || n.kind === "error") return `${n.id}(["${lbl}"])`;
        if (n.kind === "decision") return `${n.id}{"${lbl}"}`;
        if (n.kind === "endpoint") return `${n.id}[/"${lbl}"/]`;
        return `${n.id}["${lbl}"]`;
      };
      const lines = ["flowchart LR"];
      for (const n of flow.nodes) lines.push(`  ${shape(n)}`);
      for (const e of flow.edges) {
        const lbl = e.label ? `|"${e.label.replace(/"/g, "'")}"|` : "";
        lines.push(`  ${e.from} -->${lbl} ${e.to}`);
      }
      return lines.join("\n");
    }

    const FLOW_SCALE_X = 1.42;
    const FLOW_SCALE_Y = 1.24;

    function getFlowNodeBox(node) {
      const sx = Math.round(node.x * FLOW_SCALE_X);
      const sy = Math.round(node.y * FLOW_SCALE_Y);
      if (node.kind === "decision") {
        return { x: sx - 12, y: sy - 21, w: 248, h: 130 };
      }
      if (node.kind === "endpoint") {
        return { x: sx - 5, y: sy, w: 234, h: 88 };
      }
      return { x: sx, y: sy, w: 224, h: 88 };
    }

    function renderFlowNodeShapeSvg(kind, w, h) {
      if (kind === "start" || kind === "end" || kind === "error") {
        const rx = Math.round((h - 4) / 2);
        return `<svg class="flow-shape-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect class="flow-shape-path" x="2" y="2" width="${w - 4}" height="${h - 4}" rx="${rx}" ry="${rx}" /></svg>`;
      }
      if (kind === "decision") {
        const cx = w / 2;
        const cy = h / 2;
        return `<svg class="flow-shape-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon class="flow-shape-path" points="${cx},2 ${w - 2},${cy} ${cx},${h - 2} 2,${cy}" /></svg>`;
      }
      if (kind === "endpoint") {
        const skew = 20;
        return `<svg class="flow-shape-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon class="flow-shape-path" points="${skew},2 ${w - 2},2 ${w - skew},${h - 2} 2,${h - 2}" /></svg>`;
      }
      return `<svg class="flow-shape-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect class="flow-shape-path" x="2" y="2" width="${w - 4}" height="${h - 4}" rx="3" ry="3" /></svg>`;
    }

    function getFlowAnchor(node, side) {
      const box = getFlowNodeBox(node);
      if (side === "top") return { x: box.x + box.w / 2, y: box.y };
      if (side === "bottom") return { x: box.x + box.w / 2, y: box.y + box.h };
      if (side === "left") return { x: box.x + (node.kind === "endpoint" ? 11 : 0), y: box.y + box.h / 2 };
      return { x: box.x + box.w - (node.kind === "endpoint" ? 11 : 0), y: box.y + box.h / 2 };
    }

    function renderFlowchartView() {
      const flow = getActiveFlow();
      const stageW = Math.round(flow.width * FLOW_SCALE_X) + 60;
      const stageH = Math.round(flow.height * FLOW_SCALE_Y) + 40;
      const nodeMap = Object.fromEntries(flow.nodes.map((n) => [n.id, n]));
      const activeNode = nodeMap[state.activeFlowNodeId] || flow.nodes[0];
      const outEdges = flow.edges.filter((e) => e.from === activeNode.id);
      const inEdges = flow.edges.filter((e) => e.to === activeNode.id);
      const relatedSet = new Set([activeNode.id, ...outEdges.map((e) => e.to), ...inEdges.map((e) => e.from)]);

      const kindLabels = {
        start: "Terminator (Mulai)",
        process: "Proses",
        decision: "Keputusan (Ya/Tidak)",
        endpoint: "Input / Output (API)",
        error: "Terminator (Error HTTP)",
        end: "Terminator (Selesai)"
      };

      const edgeSvgs = [];
      const edgeLabels = [];

      for (const e of flow.edges) {
        const src = nodeMap[e.from];
        const dst = nodeMap[e.to];
        if (!src || !dst) continue;

        const p1 = getFlowAnchor(src, e.fromSide);
        const p2 = getFlowAnchor(dst, e.toSide);

        let d = "";
        let mx = (p1.x + p2.x) / 2;
        let my = (p1.y + p2.y) / 2;

        if (Math.abs(p1.y - p2.y) < 4 || Math.abs(p1.x - p2.x) < 4) {
          d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
        } else {
          const offsetFor = (side, dist) => {
            if (side === "top") return { x: 0, y: -dist };
            if (side === "bottom") return { x: 0, y: dist };
            if (side === "left") return { x: -dist, y: 0 };
            return { x: dist, y: 0 };
          };
          const span = Math.max(48, Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.35);
          const o1 = offsetFor(e.fromSide, span);
          const o2 = offsetFor(e.toSide, span);
          const c1x = p1.x + o1.x;
          const c1y = p1.y + o1.y;
          const c2x = p2.x + o2.x;
          const c2y = p2.y + o2.y;
          d = `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
          mx = 0.125 * p1.x + 0.375 * c1x + 0.375 * c2x + 0.125 * p2.x;
          my = 0.125 * p1.y + 0.375 * c1y + 0.375 * c2y + 0.125 * p2.y;
        }

        const isConnected = e.from === activeNode.id || e.to === activeNode.id;
        const toneCls = e.tone && e.tone !== "default" ? `is-${e.tone}` : "";
        const dimCls = state.flowFocusOnly && !isConnected ? "is-dim" : "";
        const activeCls = isConnected ? "is-active" : "";
        const markerId = isConnected ? `flowArrow-${e.tone || "active"}` : `flowArrow-${e.tone || "default"}`;

        edgeSvgs.push(`<path class="flow-edge ${toneCls} ${activeCls} ${dimCls}" d="${d}" marker-end="url(#${markerId})" />`);

        if (e.label) {
          edgeLabels.push(`
            <div class="flow-edge-badge ${toneCls} ${dimCls}" style="left:${mx}px;top:${my}px;">
              ${escapeHtml(e.label)}
            </div>
          `);
        }
      }

      const nodesHtml = flow.nodes.map((n) => {
        const box = getFlowNodeBox(n);
        const isActive = n.id === activeNode.id;
        const cls = isActive ? "is-active" : (relatedSet.has(n.id) ? "is-related" : (state.flowFocusOnly ? "is-dim" : ""));
        return `
          <button type="button" class="flow-node k-${n.kind} ${cls}" data-flow-node="${escapeHtml(n.id)}" style="left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px;" title="${escapeHtml(kindLabels[n.kind] || n.kind)}: ${escapeHtml(n.title)}">
            ${renderFlowNodeShapeSvg(n.kind, box.w, box.h)}
            <div class="flow-node-content">
              <div class="flow-node-title">${escapeHtml(n.title)}</div>
              <div class="flow-node-sub">${escapeHtml(n.sub)}</div>
            </div>
          </button>
        `;
      }).join("");

      const lanesHtml = (flow.lanes || []).map((l) => `
        <div class="flow-lane-tag" style="left:${Math.round(l.x * FLOW_SCALE_X)}px;top:${Math.round(l.y * FLOW_SCALE_Y)}px;">${escapeHtml(l.text)}</div>
      `).join("");

      const linkedEndpoints = (activeNode.eps || []).map((id) => findEndpoint(id)).filter(Boolean);

      return `
        <div class="card" style="margin-bottom:14px;">
          <div class="card-header">
            <div>
              <strong>Flowchart Alur Sistem &amp; API SehatKita</strong>
              <div style="font-size:13px;color:var(--text-3);margin-top:2px;">
                Visualisasi alur eksekusi endpoint, middleware keamanan, validasi medis, serta tindak lanjut otomatis dengan simbol baku Flowchart (ISO 5807).
              </div>
            </div>
            <button type="button" class="btn" id="copyMermaidFlowBtn" title="Salin diagram flowchart format Mermaid">Salin Mermaid Flowchart</button>
          </div>
          <div class="card-body" style="padding-bottom:12px;">
            <div class="flow-tabs">
              ${API_FLOWCHARTS.map((f) => `
                <button type="button" class="btn ${f.id === flow.id ? "btn-primary" : ""}" data-select-flow="${f.id}">
                  <span>${escapeHtml(f.title)}</span>
                  <span class="pill" style="${f.id === flow.id ? "background:rgba(255,255,255,.2);color:#fff;border-color:transparent;" : ""}">${escapeHtml(f.badge)}</span>
                </button>
              `).join("")}
            </div>
            <div style="font-size:13px;color:var(--text-2);">${formatRichText(flow.summary)}</div>
          </div>
        </div>

        <div class="flow-shell">
          <div class="flow-head">
            <div class="erd-legend">
              <strong>${escapeHtml(flow.title)}</strong>
              <span class="pill">Klik simbol untuk melihat detail &amp; lompat ke endpoint</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn ${state.flowFocusOnly ? "btn-primary" : ""}" id="flowToggleFocusBtn" style="min-height:30px;padding:3px 10px;font-size:12px;">
                ${state.flowFocusOnly ? "Tampilkan Semua Jelas" : "Mode Fokus Node"}
              </button>
              <button type="button" class="btn" id="flowFitBtn" style="min-height:30px;padding:3px 10px;font-size:12px;">Fit Layar</button>
              <button type="button" class="btn" id="flowZoomOutBtn" style="min-height:30px;padding:3px 10px;">-</button>
              <span class="mono" style="font-size:12px;min-width:44px;text-align:center;">${Math.round(state.flowZoom * 100)}%</span>
              <button type="button" class="btn" id="flowZoomInBtn" style="min-height:30px;padding:3px 10px;">+</button>
              <button type="button" class="btn" id="flowZoomResetBtn" style="min-height:30px;padding:3px 10px;font-size:12px;">100%</button>
            </div>
          </div>
          <div class="flow-symbol-legend" aria-label="Legenda Simbol Flowchart ISO 5807">
            <strong>Simbol Flowchart:</strong>
            <span class="flow-sym-item">
              <svg width="28" height="16" viewBox="0 0 28 16"><rect x="1" y="1" width="26" height="14" rx="7" fill="var(--primary-050)" stroke="var(--primary)" stroke-width="1.8"/></svg>
              Terminator (Mulai)
            </span>
            <span class="flow-sym-item">
              <svg width="28" height="16" viewBox="0 0 28 16"><polygon points="6,1 27,1 22,15 1,15" fill="var(--surface)" stroke="var(--primary)" stroke-width="1.8"/></svg>
              Input / Output (API)
            </span>
            <span class="flow-sym-item">
              <svg width="26" height="16" viewBox="0 0 26 16"><rect x="1" y="1" width="24" height="14" rx="1.5" fill="var(--surface)" stroke="var(--text-2)" stroke-width="1.8"/></svg>
              Proses Sistem
            </span>
            <span class="flow-sym-item">
              <svg width="24" height="18" viewBox="0 0 24 18"><polygon points="12,1 23,9 12,17 1,9" fill="var(--warning-bg)" stroke="var(--warning)" stroke-width="1.8"/></svg>
              Keputusan (Ya / Tidak)
            </span>
            <span class="flow-sym-item">
              <svg width="28" height="16" viewBox="0 0 28 16"><rect x="1" y="1" width="26" height="14" rx="7" fill="var(--accent-050)" stroke="var(--accent)" stroke-width="1.8"/></svg>
              Terminator (Selesai)
            </span>
            <span class="flow-sym-item">
              <svg width="28" height="16" viewBox="0 0 28 16"><rect x="1" y="1" width="26" height="14" rx="7" fill="var(--danger-bg)" stroke="var(--danger)" stroke-width="1.8"/></svg>
              Terminator (Error HTTP)
            </span>
          </div>
          <div class="flow-viewport" id="flowViewport">
            <div class="flow-stage" style="width:${stageW}px;height:${stageH}px;transform:scale(${state.flowZoom});">
              ${lanesHtml}
              <svg class="flow-svg" width="${stageW}" height="${stageH}" viewBox="0 0 ${stageW} ${stageH}" aria-hidden="true">
                <defs>
                  <marker id="flowArrow-default" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-2)" />
                  </marker>
                  <marker id="flowArrow-active" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--primary)" />
                  </marker>
                  <marker id="flowArrow-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--accent)" />
                  </marker>
                  <marker id="flowArrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--warning)" />
                  </marker>
                  <marker id="flowArrow-err" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--danger)" />
                  </marker>
                </defs>
                ${edgeSvgs.join("")}
              </svg>
              ${edgeLabels.join("")}
              ${nodesHtml}
            </div>
          </div>
        </div>

        <section class="card" aria-label="Detail Langkah Flowchart">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <strong style="font-size:15px;">${escapeHtml(activeNode.title)}</strong>
              <span class="pill pill-primary">${escapeHtml(kindLabels[activeNode.kind] || activeNode.kind)}</span>
              <code class="inline-code">${escapeHtml(activeNode.sub)}</code>
            </div>
          </div>
          <div class="card-body">
            <p style="margin:0 0 14px;font-size:13.5px;color:var(--text-2);line-height:1.6;">
              ${formatRichText(activeNode.desc)}
            </p>
            <div class="grid-2">
              <div class="rel-item">
                <strong style="font-size:12.5px;">Langkah Sebelumnya (${inEdges.length})</strong>
                ${inEdges.length ? inEdges.map((e) => {
                  const prev = nodeMap[e.from];
                  return `
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                      <button type="button" class="fk-jump-btn" data-flow-node="${escapeHtml(prev.id)}">${escapeHtml(prev.title)}</button>
                      <span style="font-size:11.5px;color:var(--text-3);">${escapeHtml(e.label || "Lanjut")} &rarr;</span>
                    </div>
                  `;
                }).join("") : '<span style="font-size:12.5px;color:var(--text-3);">Titik awal alur.</span>'}
              </div>
              <div class="rel-item">
                <strong style="font-size:12.5px;">Cabang Berikutnya (${outEdges.length})</strong>
                ${outEdges.length ? outEdges.map((e) => {
                  const nxt = nodeMap[e.to];
                  return `
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                      <span style="font-size:11.5px;color:var(--text-3);">${escapeHtml(e.label || "Lanjut")} &rarr;</span>
                      <button type="button" class="fk-jump-btn" data-flow-node="${escapeHtml(nxt.id)}">${escapeHtml(nxt.title)}</button>
                    </div>
                  `;
                }).join("") : '<span style="font-size:12.5px;color:var(--text-3);">Titik akhir alur.</span>'}
              </div>
            </div>
            ${linkedEndpoints.length ? `
              <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:12.5px;font-weight:700;color:var(--text-2);">Buka Endpoint Terkait:</span>
                ${linkedEndpoints.map(({ ep }) => `
                  <button type="button" class="btn" data-jump-ep="${escapeHtml(ep.id)}" style="min-height:32px;padding:4px 10px;font-size:12px;">
                    <span class="method m-${ep.method}">${ep.method}</span>
                    <span class="mono">${escapeHtml(ep.path)}</span>
                  </button>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </section>
      `;
    }

    function bindFlowchartEvents() {
      document.querySelectorAll("[data-select-flow]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeFlowId = btn.dataset.selectFlow;
          const flow = getActiveFlow();
          state.activeFlowNodeId = flow.nodes[0]?.id || null;
          state.flowScrollLeft = 0;
          state.flowScrollTop = 0;
          renderMain();
        });
      });

      document.querySelectorAll("[data-flow-node]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeFlowNodeId = btn.dataset.flowNode;
          renderMain();
        });
      });

      document.querySelectorAll("[data-jump-ep]").forEach((btn) => {
        btn.addEventListener("click", () => openEndpoint(btn.dataset.jumpEp));
      });

      $("#flowToggleFocusBtn")?.addEventListener("click", () => {
        state.flowFocusOnly = !state.flowFocusOnly;
        renderMain();
      });
      $("#flowFitBtn")?.addEventListener("click", () => {
        const vpEl = $("#flowViewport");
        const flow = getActiveFlow();
        const stageW = Math.round(flow.width * FLOW_SCALE_X) + 60;
        if (vpEl && stageW > 0) {
          const fit = Math.max(0.45, Math.min(1, +((vpEl.clientWidth - 24) / stageW).toFixed(2)));
          state.flowZoom = fit;
          state.flowScrollLeft = 0;
          state.flowScrollTop = 0;
          renderMain();
        }
      });
      $("#flowZoomInBtn")?.addEventListener("click", () => {
        state.flowZoom = Math.min(1.5, +(state.flowZoom + 0.1).toFixed(2));
        renderMain();
      });
      $("#flowZoomOutBtn")?.addEventListener("click", () => {
        state.flowZoom = Math.max(0.45, +(state.flowZoom - 0.1).toFixed(2));
        renderMain();
      });
      $("#flowZoomResetBtn")?.addEventListener("click", () => {
        state.flowZoom = 1;
        renderMain();
      });

      $("#copyMermaidFlowBtn")?.addEventListener("click", (e) => {
        copyText(buildMermaidFlowchart(getActiveFlow()), e.currentTarget);
      });

      const vp = $("#flowViewport");
      if (vp) {
        vp.scrollLeft = state.flowScrollLeft || 0;
        vp.scrollTop = state.flowScrollTop || 0;
        vp.addEventListener("scroll", () => {
          state.flowScrollLeft = vp.scrollLeft;
          state.flowScrollTop = vp.scrollTop;
        });

        let dragging = false;
        let sx = 0, sy = 0, sl = 0, st = 0;
        vp.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) return;
          dragging = true;
          sx = e.clientX;
          sy = e.clientY;
          sl = vp.scrollLeft;
          st = vp.scrollTop;
          window.addEventListener("mouseup", () => { dragging = false; }, { once: true });
        });
        vp.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          vp.scrollLeft = sl - (e.clientX - sx);
          vp.scrollTop = st - (e.clientY - sy);
        });
      }
    }

    function renderMain() {
      const container = $("#viewContainer");
      if (state.view === "overview") {
        container.innerHTML = renderOverview();
        container.querySelectorAll("[data-jump-ep]").forEach((btn) => {
          btn.addEventListener("click", () => openEndpoint(btn.dataset.jumpEp));
        });
      } else if (state.view === "http") {
        container.innerHTML = renderHttpGuide();
        container.querySelectorAll("[data-http-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.httpFilter = btn.dataset.httpFilter;
            renderMain();
          });
        });
      } else if (state.view === "schema") {
        container.innerHTML = renderSchemaView();
        bindSchemaEvents();
      } else if (state.view === "flowchart") {
        container.innerHTML = renderFlowchartView();
        bindFlowchartEvents();
      } else {
        container.innerHTML = renderEndpointView();
        bindEndpointEvents();
      }
      $("#btnViewOverview").classList.toggle("btn-primary", state.view === "overview");
      $("#btnViewHttp").classList.toggle("btn-primary", state.view === "http");
      $("#btnViewSchema").classList.toggle("btn-primary", state.view === "schema");
      $("#btnViewFlowchart").classList.toggle("btn-primary", state.view === "flowchart");
    }

    function bindEndpointEvents() {
      const found = findEndpoint(state.activeEndpointId);
      if (!found) return;
      const { ep } = found;

      document.querySelectorAll("[data-req-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.reqTab = btn.dataset.reqTab;
          renderMain();
        });
      });

      document.querySelectorAll("[data-status-code]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeStatusCode = Number(btn.dataset.statusCode);
          renderMain();
        });
      });

      document.querySelectorAll("[data-jump-ep]").forEach((btn) => {
        btn.addEventListener("click", () => openEndpoint(btn.dataset.jumpEp));
      });

      $("#toggleSplitBtn")?.addEventListener("click", () => {
        state.splitLayout = !state.splitLayout;
        renderMain();
      });

      $("#copyUrlBtn")?.addEventListener("click", (e) => {
        copyText(`${$("#baseUrlSelect").value}${ep.path}`, e.currentTarget);
      });

      $("#copyBodyBtn")?.addEventListener("click", (e) => {
        const val = $("#liveBodyEditor")?.value || JSON.stringify(ep.body, null, 2);
        copyText(val, e.currentTarget);
      });

      $("#copyCurlBtn")?.addEventListener("click", (e) => {
        copyText($("#curlPre").textContent, e.currentTarget);
      });

      $("#copyRespBtn")?.addEventListener("click", (e) => {
        const activeResp = ep.responses.find((r) => r.code === state.activeStatusCode) || ep.responses[0];
        copyText(JSON.stringify(activeResp.body, null, 2), e.currentTarget);
      });

      $("#sendLiveBtn")?.addEventListener("click", () => sendLiveRequest(ep));
      $("#clearLiveBtn")?.addEventListener("click", () => {
        state.liveResult = null;
        renderMain();
      });
    }

    function render() {
      renderSidebar();
      renderMain();
    }

    function closeMobileMenu() {
      $("#sidebar").classList.remove("open");
    }

    // Event Bindings Global
    $("#searchInput").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderSidebar();
    });

    $("#roleFilter").addEventListener("change", (e) => {
      state.roleFilter = e.target.value;
      renderSidebar();
    });

    $("#baseUrlSelect").addEventListener("change", () => {
      if (state.view === "endpoint") renderMain();
    });

    $("#tokenInput").addEventListener("input", () => {
      if (state.view === "endpoint" && state.reqTab === "curl") renderMain();
    });

    $("#btnViewOverview").addEventListener("click", () => {
      state.view = "overview";
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    $("#btnViewHttp").addEventListener("click", () => {
      state.view = "http";
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    $("#btnViewSchema").addEventListener("click", () => {
      state.view = "schema";
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    $("#btnViewFlowchart").addEventListener("click", () => {
      state.view = "flowchart";
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    $("#mobileMenuBtn").addEventListener("click", () => {
      $("#sidebar").classList.toggle("open");
    });

    $("#themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
    });

    render();
  </script>
</body>
</html>
