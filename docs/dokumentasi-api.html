<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokumentasi API SehatKita v1.10.1 — Monitoring Kesehatan PTM</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563EB;
      --primary-600: #1D4ED8;
      --primary-050: #EFF6FF;
      --accent: #16A34A;
      --accent-050: #F0FDF4;
      --warning: #B45309;
      --warning-bg: #FFFBEB;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --purple: #7C3AED;
      --purple-bg: #F5F3FF;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-2: #F1F5F9;
      --surface-3: #E2E8F0;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --text-2: #334155;
      --text-3: #64748B;
      --code-bg: #0F172A;
      --code-surface: #1E293B;
      --code-text: #E2E8F0;
      --code-key: #7DD3FC;
      --code-str: #86EFAC;
      --code-num: #FDE047;
      --code-bool: #C4B5FD;
      --code-null: #94A3B8;
      --radius-sm: 8px;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sidebar-w: 336px;
      --header-h: 64px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #60A5FA;
      --primary-600: #3B82F6;
      --primary-050: rgba(96, 165, 250, .14);
      --accent: #4ADE80;
      --accent-050: rgba(74, 222, 128, .12);
      --warning: #FBBF24;
      --warning-bg: rgba(251, 191, 36, .12);
      --danger: #F87171;
      --danger-bg: rgba(248, 113, 113, .14);
      --purple: #A78BFA;
      --purple-bg: rgba(167, 139, 250, .14);
      --bg: #0B1120;
      --surface: #111827;
      --surface-2: #1E293B;
      --surface-3: #334155;
      --border: #1F2937;
      --border-strong: #334155;
      --text: #F8FAFC;
      --text-2: #CBD5E1;
      --text-3: #94A3B8;
      --code-bg: #090D16;
      --code-surface: #131B2E;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      min-height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 12px;
      padding: 8px 18px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      white-space: nowrap;
    }

    .pill-primary {
      background: var(--primary-050);
      color: var(--primary);
      border-color: transparent;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-600); border-color: var(--primary-600); }

    .btn-icon {
      min-width: 36px;
      padding: 6px;
    }

    .mobile-menu-btn { display: none; }

    /* Layout Shell */
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-h));
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-controls {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 8px;
    }

    .input {
      width: 100%;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-050);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px 24px;
    }

    .nav-section-btn {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }

    .nav-section-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-section-btn.active {
      background: var(--primary-050);
      color: var(--primary);
      border-color: transparent;
    }

    .nav-group { margin-top: 10px; }

    .nav-group-header {
      width: 100%;
      background: transparent;
      border: none;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-3);
      cursor: pointer;
    }

    .nav-group-header:hover { color: var(--text); }

    .nav-items {
      display: grid;
      gap: 4px;
      padding-left: 2px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: var(--text-2);
      transition: background .12s, border-color .12s;
    }

    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active {
      background: var(--primary-050);
      border-left-color: var(--primary);
      color: var(--text);
    }

    .nav-item-title {
      font-weight: 600;
      font-size: 12.5px;
      line-height: 1.3;
      color: var(--text);
    }

    .nav-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .nav-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }

    /* Method Badges (Postman Style) */
    .method {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 5px;
      letter-spacing: .02em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .method-lg { font-size: 12px; padding: 4px 10px; }

    .m-GET { background: var(--accent-050); color: var(--accent); }
    .m-POST { background: var(--warning-bg); color: var(--warning); }
    .m-PUT { background: var(--primary-050); color: var(--primary); }
    .m-PATCH { background: var(--purple-bg); color: var(--purple); }
    .m-DELETE { background: var(--danger-bg); color: var(--danger); }

    /* Status Code Badges */
    .st-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .st-2xx { background: var(--accent-050); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
    .st-4xx { background: var(--warning-bg); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 25%, transparent); }
    .st-401, .st-403, .st-404, .st-409, .st-429 { background: var(--warning-bg); color: var(--warning); }
    .st-5xx { background: var(--danger-bg); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 28%, transparent); }

    /* Main Workspace */
    .main {
      padding: 24px 32px 64px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    /* Environment Bar (Postman Request Bar) */
    .env-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .env-field {
      display: grid;
      gap: 4px;
    }

    .env-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* Cards & Surfaces */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card + .card { margin-top: 16px; }

    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-body { padding: 18px; }

    /* Endpoint Header */
    .ep-url-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .ep-url-text {
      font-family: var(--mono);
      font-size: 13.5px;
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }

    .ep-base-muted { color: var(--text-3); }
    .ep-path-bold { color: var(--text); font-weight: 600; }

    .role-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .role-tag {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      font-family: var(--mono);
    }
    .role-publik { background: var(--surface-2); color: var(--text-2); }
    .role-user { background: var(--accent-050); color: var(--accent); border-color: transparent; }
    .role-kader { background: var(--primary-050); color: var(--primary); border-color: transparent; }
    .role-admin_kelurahan { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
    .role-super_admin { background: var(--purple-bg); color: var(--purple); border-color: transparent; }

    /* Workbench: default stacked untuk keterbacaan penuh, opsional split */
    .workbench {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }
    .workbench.is-split {
      grid-template-columns: 1fr 1fr;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .module-card {
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color .15s, background .15s;
    }
    .module-card:hover {
      background: var(--primary-050);
      border-color: var(--primary);
    }

    .ep-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .http-filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      overflow-x: auto;
      background: var(--surface-2);
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--surface);
    }

    /* Tables */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .03em;
      background: var(--surface-2);
    }

    tr:last-child td { border-bottom: none; }

    code, .mono {
      font-family: var(--mono);
      font-size: 12.5px;
    }

    .inline-code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface-2);
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    /* Code Viewer (Postman Body) */
    .code-box {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border-strong);
    }

    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--code-surface);
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 11.5px;
      color: #94A3B8;
      gap: 8px;
      flex-wrap: wrap;
    }

    pre.code-pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      max-height: 460px;
      overflow-y: auto;
      tab-size: 2;
    }

    textarea.code-editor {
      width: 100%;
      min-height: 210px;
      background: var(--code-bg);
      color: var(--code-text);
      border: none;
      padding: 14px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.5;
      resize: vertical;
      display: block;
    }

    .jk { color: var(--code-key); }
    .js { color: var(--code-str); }
    .jn { color: var(--code-num); }
    .jb { color: var(--code-bool); }
    .jl { color: var(--code-null); }

    /* Response Status Switcher */
    .status-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .status-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-2);
    }

    .status-tab:hover { border-color: var(--border-strong); }
    .status-tab.active.is-2xx { background: var(--accent-050); color: var(--accent); border-color: var(--accent); }
    .status-tab.active.is-4xx { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
    .status-tab.active.is-5xx { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

    .status-explain {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    /* Alert Boxes */
    .callout {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--primary);
      background: var(--primary-050);
      font-size: 13px;
      color: var(--text);
      margin-top: 12px;
    }
    .callout-warn { border-left-color: var(--warning); background: var(--warning-bg); }
    .callout-danger { border-left-color: var(--danger); background: var(--danger-bg); }

    /* Grid for Overview & HTTP Status Reference */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .stat-lbl {
      font-size: 12.5px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .http-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .http-card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--surface-2);
    }

    .http-card-body {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .copy-btn-mini {
      background: rgba(255,255,255,.1);
      color: #E2E8F0;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn-mini:hover { background: rgba(255,255,255,.2); }

    .live-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 1040px) {
      .workbench.is-split, .http-card-body, .grid-2 { grid-template-columns: 1fr; }
      .env-bar { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .mobile-menu-btn { display: inline-flex; }
      .sidebar {
        position: fixed;
        left: 0;
        top: var(--header-h);
        width: min(320px, 88vw);
        z-index: 50;
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: 0 20px 50px rgba(0,0,0,.3);
      }
      .sidebar.open { transform: translateX(0); }
      .main { padding: 14px 14px 40px; }
    }

    /* =========================================================================
       SKEMA DATABASE & INTERACTIVE ERD VIEWER
       ========================================================================= */
    .schema-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .schema-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schema-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cluster-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .c-core { --cl: #2563EB; --cl-bg: rgba(37, 99, 235, .10); }
    .c-clinical { --cl: #16A34A; --cl-bg: rgba(22, 163, 74, .10); }
    .c-gamification { --cl: #7C3AED; --cl-bg: rgba(124, 58, 237, .10); }
    .c-service { --cl: #D97706; --cl-bg: rgba(217, 119, 6, .11); }

    :root[data-theme="dark"] .c-core { --cl: #60A5FA; --cl-bg: rgba(96, 165, 250, .14); }
    :root[data-theme="dark"] .c-clinical { --cl: #4ADE80; --cl-bg: rgba(74, 222, 128, .14); }
    :root[data-theme="dark"] .c-gamification { --cl: #A78BFA; --cl-bg: rgba(167, 139, 250, .14); }
    :root[data-theme="dark"] .c-service { --cl: #FBBF24; --cl-bg: rgba(251, 191, 36, .14); }

    .cluster-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--cl-bg);
      color: var(--cl);
      border: 1px solid color-mix(in srgb, var(--cl) 25%, transparent);
    }

    .erd-shell {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .erd-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .erd-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-2);
    }

    .erd-viewport {
      position: relative;
      overflow: auto;
      height: 580px;
      background-color: var(--bg);
      background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: grab;
    }
    .erd-viewport:active { cursor: grabbing; }

    .erd-stage {
      position: relative;
      width: 1655px;
      height: 1220px;
      transform-origin: 0 0;
      transition: transform .15s ease;
    }

    .erd-zone {
      position: absolute;
      border: 1.5px dashed color-mix(in srgb, var(--cl) 35%, transparent);
      background: color-mix(in srgb, var(--cl) 4%, transparent);
      border-radius: 14px;
      pointer-events: none;
    }
    .erd-zone-label {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--cl);
      opacity: .88;
    }

    .erd-svg {
      position: absolute;
      inset: 0;
      width: 1655px;
      height: 1220px;
      pointer-events: none;
      z-index: 1;
    }

    .erd-edge {
      fill: none;
      stroke: var(--border-strong);
      stroke-width: 1.6;
      opacity: .58;
      transition: opacity .15s, stroke .15s, stroke-width .15s;
    }
    .erd-edge.is-dim { opacity: .12; }
    .erd-edge.is-out {
      stroke: var(--primary);
      stroke-width: 2.6;
      opacity: 1;
    }
    .erd-edge.is-in {
      stroke: var(--accent);
      stroke-width: 2.6;
      opacity: 1;
    }

    .erd-node {
      position: absolute;
      width: 236px;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      z-index: 2;
      cursor: pointer;
      text-align: left;
      padding: 0;
      overflow: hidden;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, opacity .14s ease;
    }
    .erd-node:hover {
      transform: translateY(-2px);
      border-color: var(--cl);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .12);
    }
    .erd-node.is-active {
      border-color: var(--cl);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--cl) 26%, transparent), 0 10px 24px rgba(15, 23, 42, .14);
      z-index: 4;
    }
    .erd-node.is-related {
      border-color: var(--cl);
      z-index: 3;
    }
    .erd-node.is-dim {
      opacity: .34;
    }

    .erd-node-head {
      padding: 7px 10px;
      background: var(--cl-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .erd-node-name {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .erd-node-count {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--cl);
      background: var(--surface);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--cl) 30%, transparent);
      flex-shrink: 0;
    }
    .erd-node-cols {
      padding: 6px 10px 8px;
      display: grid;
      gap: 3px;
    }
    .erd-col-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      line-height: 1.35;
      color: var(--text-2);
    }
    .erd-col-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .erd-col-name {
      font-family: var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .erd-col-type {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .erd-more {
      font-size: 10.5px;
      color: var(--text-3);
      padding-top: 2px;
      border-top: 1px dashed var(--border);
      margin-top: 2px;
    }

    /* Key Badges */
    .k-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .k-pk { background: var(--warning-bg); color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); }
    .k-fk { background: var(--primary-050); color: var(--primary); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); }
    .k-uk { background: var(--purple-bg); color: var(--purple); border: 1px solid color-mix(in srgb, var(--purple) 30%, transparent); }
    .k-idx { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }

    /* Schema Catalog Grid */
    .schema-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .schema-card {
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .schema-card:hover {
      border-color: var(--cl);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .schema-card.is-active {
      border-color: var(--cl);
      box-shadow: 0 0 0 3px var(--cl-bg);
    }

    .fk-jump-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
      background: var(--primary-050);
      color: var(--primary);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .fk-jump-btn:hover { background: var(--primary); color: #fff; }

    .rel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .rel-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .main, .erd-shell, .schema-inspector, .card, .code-box {
      min-width: 0;
      max-width: 100%;
    }

    @media (max-width: 900px) {
      .topbar { padding: 8px 14px; }
      .topbar-actions { width: 100%; justify-content: flex-start; }
      .topbar-actions .btn { min-height: 32px; padding: 4px 9px; font-size: 12px; }
      .schema-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rel-grid { grid-template-columns: 1fr; }
      .erd-viewport { height: 440px; }
      #schemaSearchInput, #quickTableSelect { width: 100% !important; min-width: 0 !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .erd-stage, .erd-node, .schema-card, .erd-edge, .flow-stage, .flow-node, .flow-edge { transition: none !important; }
    }

    /* =========================================================================
       FLOWCHART ALUR API INTERAKTIF
       ========================================================================= */
    .flow-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .flow-shell {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .flow-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flow-viewport {
      position: relative;
      overflow: auto;
      height: 600px;
      background-color: var(--bg);
      background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: grab;
    }
    .flow-viewport:active { cursor: grabbing; }

    .flow-stage {
      position: relative;
      transform-origin: 0 0;
      transition: transform .15s ease;
    }

    .flow-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .flow-edge {
      fill: none;
      stroke: var(--text-2);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .92;
      transition: opacity .15s, stroke .15s, stroke-width .15s;
    }
    .flow-edge.is-ok { stroke: var(--accent); }
    .flow-edge.is-warn { stroke: var(--warning); stroke-dasharray: 7 4; }
    .flow-edge.is-err { stroke: var(--danger); stroke-dasharray: 7 4; }
    .flow-edge.is-dim { opacity: .16; }
    .flow-edge.is-active {
      stroke: var(--primary);
      stroke-width: 3.2;
      opacity: 1;
    }
    .flow-edge.is-active.is-ok { stroke: var(--accent); }
    .flow-edge.is-active.is-warn { stroke: var(--warning); }
    .flow-edge.is-active.is-err { stroke: var(--danger); }

    .flow-edge-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 3;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(15, 23, 42, .12);
    }
    .flow-edge-badge.is-ok { color: var(--accent); border-color: var(--accent); background: var(--accent-050); }
    .flow-edge-badge.is-warn { color: var(--warning); border-color: var(--warning); background: var(--warning-bg); }
    .flow-edge-badge.is-err { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
    .flow-edge-badge.is-dim { opacity: .22; }

    .flow-node {
      position: absolute;
      background: transparent;
      border: none;
      padding: 0;
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      filter: drop-shadow(0 3px 8px rgba(15, 23, 42, .10));
      transition: transform .14s ease, filter .14s ease, opacity .14s ease;
    }
    .flow-node:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 8px 16px rgba(15, 23, 42, .18));
    }
    .flow-node.is-active {
      filter: drop-shadow(0 0 8px rgba(37, 99, 235, .36)) drop-shadow(0 6px 14px rgba(15, 23, 42, .18));
      z-index: 4;
    }
    .flow-node.is-related { z-index: 3; }
    .flow-node.is-dim { opacity: .28; }

    .flow-shape-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .flow-shape-path {
      fill: var(--surface);
      stroke: var(--text-2);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
      transition: stroke .14s ease, stroke-width .14s ease, fill .14s ease;
    }
    .flow-node.k-start .flow-shape-path { fill: var(--primary-050); stroke: var(--primary); }
    .flow-node.k-end .flow-shape-path { fill: var(--accent-050); stroke: var(--accent); }
    .flow-node.k-decision .flow-shape-path { fill: var(--warning-bg); stroke: var(--warning); }
    .flow-node.k-error .flow-shape-path { fill: var(--danger-bg); stroke: var(--danger); }
    .flow-node.k-endpoint .flow-shape-path { fill: var(--surface); stroke: var(--primary); }
    .flow-node.k-process .flow-shape-path { fill: var(--surface); stroke: var(--text-2); }

    .flow-node:hover .flow-shape-path { stroke-width: 3; }
    .flow-node.is-active .flow-shape-path { stroke-width: 3.6; }

    .flow-node-content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      pointer-events: none;
    }
    .flow-node.k-endpoint .flow-node-content { padding: 8px 28px; }
    .flow-node.k-decision .flow-node-content { padding: 16px 38px; }
    .flow-node.k-start .flow-node-content,
    .flow-node.k-end .flow-node-content,
    .flow-node.k-error .flow-node-content { padding: 8px 24px; }

    .flow-node-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      max-width: 100%;
    }
    .flow-node.k-decision .flow-node-title { font-size: 12px; }
    .flow-node-sub {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      max-width: 100%;
      line-height: 1.25;
      word-break: break-word;
    }
    .flow-node.k-decision .flow-node-sub { font-size: 10px; }

    .flow-symbol-legend {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .flow-sym-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .flow-sym-item svg {
      flex-shrink: 0;
    }

    .flow-lane-tag {
      position: absolute;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-3);
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .flow-viewport { height: 420px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button type="button" class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka navigasi endpoint">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand-logo" aria-hidden="true">SK</div>
      <div>
        <div class="brand-title">SehatKita API Reference</div>
        <div class="brand-sub">
          <span>Kontrak API v1.10.1</span>
          <span class="pill pill-primary">Laravel + Sanctum</span>
        </div>
      </div>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn" id="btnViewOverview">Ringkasan &amp; Konvensi</button>
      <button type="button" class="btn" id="btnViewHttp">Referensi Kode HTTP (200–502)</button>
      <button type="button" class="btn" id="btnViewSchema">Skema Database (ERD)</button>
      <button type="button" class="btn" id="btnViewFlowchart">Flowchart Alur API</button>
      <button type="button" class="btn btn-icon" id="themeToggle" aria-label="Ubah tema terang atau gelap" title="Mode Terang/Gelap">
        <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi Endpoint API">
      <div class="sidebar-controls">
        <input type="search" class="input" id="searchInput" placeholder="Cari path, judul, atau modul..." aria-label="Cari endpoint" />
        <select class="input" id="roleFilter" aria-label="Filter berdasarkan role">
          <option value="all">Semua Role</option>
          <option value="publik">publik (tanpa token)</option>
          <option value="user">user (warga)</option>
          <option value="kader">kader</option>
          <option value="admin_kelurahan">admin_kelurahan</option>
          <option value="super_admin">super_admin</option>
        </select>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main" id="mainArea">
      <section class="env-bar" aria-label="Konfigurasi Environment Postman">
        <div class="env-field">
          <label class="env-label" for="baseUrlSelect">Base URL Environment</label>
          <select class="input mono" id="baseUrlSelect">
            <option value="http://sehatkita.test/api/v1">http://sehatkita.test/api/v1</option>
            <option value="http://localhost:8000/api/v1">http://localhost:8000/api/v1</option>
            <option value="http://127.0.0.1:8000/api/v1">http://127.0.0.1:8000/api/v1</option>
          </select>
        </div>
        <div class="env-field">
          <label class="env-label" for="tokenInput">Authorization Bearer Token (Opsional untuk Live Test &amp; cURL)</label>
          <input type="text" class="input mono" id="tokenInput" placeholder="12|xxxxxxxxxxxxxxxxxxxx (atau pakai cookie HttpOnly sehatkita_token)" />
        </div>
        <div class="env-field">
          <span class="env-label">Sesi &amp; Rate Limit</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="pill">TTL 1440 mnt (24 jam)</span>
            <span class="pill">100 req/mnt</span>
          </div>
        </div>
      </section>

      <div id="viewContainer"></div>
    </main>
  </div>

  <script>
    // =========================================================================
    // DATA AKTUAL BERDASARKAN kontrak-api.md (v1.10.1), routes/api.php,
    // bootstrap/app.php, dan Controller Laravel SehatKita.
    // =========================================================================

    const HTTP_STATUS_GUIDE = [
      {
        code: 200,
        title: "200 OK",
        group: "2xx",
        source: "Laravel Controller",
        summary: "Permintaan berhasil diproses dan server mengembalikan data sesuai kontrak.",
        when: "Semua endpoint GET, PUT, PATCH, DELETE, serta POST /auth/login, POST /auth/logout, dan POST /persetujuan.",
        resolution: "Tidak perlu tindakan perbaikan. FE membaca payload dari properti `data` (dan `meta` bila berpaginasi).",
        sample: {
          success: true,
          message: "OK",
          data: { id: 12, name: "Budi Santoso" }
        }
      },
      {
        code: 201,
        title: "201 Created",
        group: "2xx",
        source: "Laravel Controller",
        summary: "Resource baru berhasil dibuat dan disimpan ke basis data.",
        when: "POST /auth/register, POST /catatan-kesehatan, POST /posbindu/sesi, POST /rujukan, POST /program, POST /edukasi, POST /pengaduan, POST /kepuasan-masyarakat, POST /target-kesehatan, POST /refleksi.",
        resolution: "Simpan ID atau objek baru yang dikembalikan di `data` untuk pembaruan state UI.",
        sample: {
          success: true,
          message: "Data berhasil dibuat",
          data: { id: 41, status: "baru" }
        }
      },
      {
        code: 401,
        title: "401 Unauthorized",
        group: "4xx",
        source: "Sanctum & Middleware EnsureSingleIpSession",
        summary: "Autentikasi gagal: token tidak dikirim, sudah dicabut, kedaluwarsa (melewati TTL 24 jam), atau dipakai dari IP berbeda.",
        when: "Header Authorization/cookie `sehatkita_token` kosong/tidak sah, token sudah logout, atau terdeteksi perpindahan alamat IP pada sesi aktif.",
        resolution: "Hapus token/sesi lokal di klien, lalu arahkan pengguna kembali ke halaman login untuk memperoleh sesi baru.",
        sample: {
          success: false,
          message: "Belum login atau token tidak valid."
        }
      },
      {
        code: 403,
        title: "403 Forbidden",
        group: "4xx",

    // Helper pembentuk contoh error standar sesuai bootstrap/app.php
    function stdResponses(opts = {}) {
      const list = [];
      if (opts.ok201) {
        list.push({ code: 201, label: "201 Created", desc: opts.okDesc || "Resource berhasil dibuat.", body: opts.ok201 });
      }
      if (opts.ok200) {
        list.push({ code: 200, label: "200 OK", desc: opts.okDesc || "Permintaan berhasil diproses.", body: opts.ok200 });
      }
      if (opts.r401 !== false) {
        list.push({
          code: 401,
          label: "401 Unauthorized",
          desc: "Token Sanctum/cookie tidak ada, kedaluwarsa (TTL 24 jam), atau IP berbeda dari sesi login.",
          body: { success: false, message: "Belum login atau token tidak valid." }
        });
      }
      if (opts.r403) {
        list.push({
          code: 403,
          label: "403 Forbidden",
          desc: typeof opts.r403 === "string" ? opts.r403 : "Token sah, tetapi role tidak berhak mengakses endpoint ini.",
          body: { success: false, message: "Tidak punya akses." }
        });
      }
      if (opts.r404) {
        list.push({
          code: 404,
          label: "404 Not Found",
          desc: typeof opts.r404 === "string" ? opts.r404 : "Data tidak ditemukan atau berada di luar scope wilayah/binaan/kepemilikan.",
          body: { success: false, message: "Data tidak ditemukan." }
        });
      }
      if (opts.r409) {
        list.push({
          code: 409,
          label: "409 Conflict",
          desc: typeof opts.r409 === "string" ? opts.r409 : "Konflik aturan sesi 1 IP 1 user atau konflik data master.",
          body: { success: false, message: opts.r409Msg || "Akun lain sedang aktif pada perangkat/IP ini. Keluar dari akun sebelumnya terlebih dahulu atau tunggu sesi berakhir." }
        });
      }
      if (opts.r422) {
        list.push({
          code: 422,
          label: "422 Validation",
          desc: typeof opts.r422 === "string" ? opts.r422 : "Validasi input atau aturan bisnis gagal.",
          body: opts.r422Body || {
            success: false,
            message: "Validasi gagal",
            errors: { field: ["Isian tidak valid atau melanggar aturan kontrak."] }
          }
        });
      }
      if (opts.r429 !== false) {
        list.push({
          code: 429,
          label: "429 Rate Limit",
          desc: opts.r429Desc || "Melebihi batas permintaan (throttle:api 100/menit, login 5/menit, register 10/menit).",
          body: { success: false, message: "Terlalu banyak permintaan, coba lagi nanti." }
        });
      }
      list.push({
        code: 500,
        label: "500 Server Error",
        desc: "Kesalahan runtime tak terduga di Laravel atau koneksi database terputus.",
        body: { success: false, message: "Terjadi kesalahan pada server." }
      });
      list.push({
        code: 502,
        label: "502 Bad Gateway",
        desc: "Layer Proxy/Nginx gagal menerima respons valid dari upstream backend:8000 (container mati/restart/crash).",
        body: { _gateway: "Nginx / Reverse Proxy", status: 502, error: "Bad Gateway — upstream sehatkita-backend tidak merespons." }
      });
      return list;
    }

    const state = {
      view: "overview", // "overview" | "http" | "schema" | "flowchart" | "endpoint"
      activeEndpointId: "auth-login",
      reqTab: "body", // "params" | "headers" | "body" | "curl"
      activeStatusCode: null,
      httpFilter: "all", // "all" | "2xx" | "4xx" | "5xx"
      splitLayout: false,
      liveResult: null,
      search: "",
      roleFilter: "all",
      collapsedGroups: {},
      schemaMode: "erd", // "erd" | "grid"
      schemaCluster: "all", // "all" | "core" | "clinical" | "gamification" | "service"
      schemaSearch: "",
      activeTable: "pengguna",
      schemaTab: "columns", // "columns" | "relations" | "sql"
      erdZoom: 1,
      showAllEdges: true,
      erdScrollLeft: 0,
      erdScrollTop: 0,
      activeFlowId: "middleware",
      activeFlowNodeId: "m-client",
      flowZoom: 0.9,
      flowFocusOnly: false,
      flowScrollLeft: 0,
      flowScrollTop: 0
    };

    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRichText(str) {
      if (!str) return "";
      return escapeHtml(str)
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function getFlatEndpoints() {
      const list = [];
      for (const g of API_GROUPS) {
        for (const ep of g.endpoints) list.push({ group: g, ep });
      }
      return list;
    }

    function openEndpoint(id) {
      state.view = "endpoint";
      state.activeEndpointId = id;
      state.activeStatusCode = null;
      state.liveResult = null;
      const found = findEndpoint(id);
      state.reqTab = found?.ep.body ? "body" : (found?.ep.queryParams || found?.ep.pathParams ? "params" : "headers");
      closeMobileMenu();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function highlightJson(obj) {
      const raw = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
      const escaped = escapeHtml(raw);
      return escaped.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
        (match) => {
          let cls = "jn";
          if (/^"/.test(match)) {
            cls = /:$/.test(match) ? "jk" : "js";
          } else if (/true|false/.test(match)) {
            cls = "jb";
          } else if (/null/.test(match)) {
            cls = "jl";
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function findEndpoint(id) {
      for (const g of API_GROUPS) {
        const ep = g.endpoints.find((e) => e.id === id);
        if (ep) return { group: g, ep };
      }
      return null;
    }

    function statusClass(code) {
      if (code >= 500) return "is-5xx";
      if (code >= 400) return "is-4xx";
      return "is-2xx";
    }

    function buildCurl(ep, customBody) {
      const base = $("#baseUrlSelect").value;
      const token = $("#tokenInput").value.trim() || "{BEARER_TOKEN}";
      let url = `${base}${ep.path}`;
      if (ep.queryParams && ep.queryParams.length) {
        const q = ep.queryParams.slice(0, 2).map((p) => `${p.name}=`).join("&");
        url += `?${q}`;
      }
      const lines = [`curl -X ${ep.method} "${url}"`, `  -H "Accept: application/json"`];
      if (ep.auth) {
        lines.push(`  -H "Authorization: Bearer ${token}"`);
      }
      if (ep.extraHeaders) {
        for (const h of ep.extraHeaders) {
          lines.push(`  -H "${h.key}: ${h.val}"`);
        }
      }
      if (ep.body && !ep.body._multipart) {
        lines.push(`  -H "Content-Type: application/json"`);
        const payload = customBody ?? JSON.stringify(ep.body, null, 2);
        lines.push(`  -d '${payload.replace(/'/g, "'\\''")}'`);
      } else if (ep.body && ep.body._multipart) {
        lines.push(`  -F "foto=@contoh.jpg"`);
      }
      return lines.join(" \\\n");
    }

    function copyText(text, btn) {
      navigator.clipboard?.writeText(text).then(() => {
        const prev = btn.textContent;
        btn.textContent = "Tersalin!";
        setTimeout(() => { btn.textContent = prev; }, 1200);
      });
    }

    function renderSidebar() {
      const nav = $("#sidebarNav");
      const q = state.search.toLowerCase().trim();
      const role = state.roleFilter;

      let html = `
        <button type="button" class="nav-section-btn ${state.view === "overview" ? "active" : ""}" data-nav-view="overview">
          <span>Ringkasan &amp; Peta Modul</span>
          <span class="pill">v1.10.1</span>
        </button>
        <button type="button" class="nav-section-btn ${state.view === "http" ? "active" : ""}" data-nav-view="http">
          <span>Referensi Kode HTTP</span>
          <span class="pill">200–504</span>
        </button>
        <button type="button" class="nav-section-btn ${state.view === "schema" ? "active" : ""}" data-nav-view="schema">
          <span>Skema Database (ERD)</span>
          <span class="pill">24 Tabel</span>
        </button>
        <button type="button" class="nav-section-btn ${state.view === "flowchart" ? "active" : ""}" data-nav-view="flowchart">
          <span>Flowchart Alur API</span>
          <span class="pill">${API_FLOWCHARTS.length} Alur</span>
        </button>
      `;

      let totalVisible = 0;
      for (const grp of API_GROUPS) {
        const filtered = grp.endpoints.filter((ep) => {
          const matchRole = role === "all" || ep.roles.includes(role);
          const matchSearch = !q || ep.path.toLowerCase().includes(q) || ep.title.toLowerCase().includes(q) || grp.title.toLowerCase().includes(q);
          return matchRole && matchSearch;
        });

        if (!filtered.length) continue;
        totalVisible += filtered.length;
        const collapsed = !!state.collapsedGroups[grp.id] && !q;

        html += `
          <div class="nav-group">
            <button type="button" class="nav-group-header" data-toggle-group="${grp.id}">
              <span>${escapeHtml(grp.title)}</span>
              <span>${filtered.length}</span>
            </button>
            ${collapsed ? "" : `
              <div class="nav-items">
                ${filtered.map((ep) => `
                  <button type="button" class="nav-item ${state.view === "endpoint" && state.activeEndpointId === ep.id ? "active" : ""}" data-ep="${ep.id}" title="${escapeHtml(ep.title)} — ${escapeHtml(ep.path)}">
                    <span class="nav-item-title">${escapeHtml(ep.title)}</span>
                    <span class="nav-item-meta">
                      <span class="method m-${ep.method}">${ep.method}</span>
                      <span class="nav-path">${escapeHtml(ep.path)}</span>
                    </span>
                  </button>
                `).join("")}
              </div>
            `}
          </div>
        `;
      }

      if (!totalVisible) {
        html += `<p style="padding:12px;font-size:12.5px;color:var(--text-3);">Tidak ada endpoint yang cocok dengan filter.</p>`;
      }

      nav.innerHTML = html;

      nav.querySelectorAll("[data-nav-view]").forEach((el) => {
        el.addEventListener("click", () => {
          state.view = el.dataset.navView;
          closeMobileMenu();
          render();
          window.scrollTo({ top: 0, behavior: "instant" });
        });
      });
      nav.querySelectorAll("[data-toggle-group]").forEach((el) => {
        el.addEventListener("click", () => {
          const gid = el.dataset.toggleGroup;
          state.collapsedGroups[gid] = !state.collapsedGroups[gid];
          renderSidebar();
        });
      });
      nav.querySelectorAll("[data-ep]").forEach((el) => {
        el.addEventListener("click", () => openEndpoint(el.dataset.ep));
      });
    }

    function renderHttpGuide() {
      const items = HTTP_STATUS_GUIDE.filter((i) => state.httpFilter === "all" || i.group === state.httpFilter);
      return `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-header">
            <div>
              <strong>Referensi Kode Status HTTP SehatKita (2xx, 4xx, 5xx)</strong>
              <div style="font-size:13px;color:var(--text-3);margin-top:2px;">
                Memisahkan respons JSON yang dihasilkan langsung oleh Laravel API dengan respons error layer Proxy/Gateway seperti <code class="inline-code">502 Bad Gateway</code>.
              </div>

    function renderEndpointView() {
      const found = findEndpoint(state.activeEndpointId);
      if (!found) return renderOverview();
      const { group, ep } = found;

      const flat = getFlatEndpoints();
      const idx = flat.findIndex((x) => x.ep.id === ep.id);
      const prevEp = idx > 0 ? flat[idx - 1].ep : null;
      const nextEp = idx >= 0 && idx < flat.length - 1 ? flat[idx + 1].ep : null;

      if (!state.activeStatusCode || !ep.responses.some((r) => r.code === state.activeStatusCode)) {
        state.activeStatusCode = ep.responses[0].code;
      }
      const activeResp = ep.responses.find((r) => r.code === state.activeStatusCode) || ep.responses[0];
      const baseUrl = $("#baseUrlSelect").value;
      const bodyStr = ep.body && !ep.body._multipart ? JSON.stringify(ep.body, null, 2) : "";

      let reqContent = "";
      if (state.reqTab === "params") {
        const rows = [
          ...(ep.pathParams || []).map((p) => ({ loc: "Path", ...p, required: true })),
          ...(ep.queryParams || []).map((p) => ({ loc: "Query", ...p }))
        ];
        reqContent = rows.length ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Lokasi</th><th>Parameter</th><th>Tipe</th><th>Keterangan</th></tr></thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td><span class="pill">${r.loc}</span></td>
                    <td><code>${escapeHtml(r.name)}</code>${r.required ? ' <span style="color:var(--danger)" title="Wajib">*</span>' : ""}</td>
                    <td><code>${escapeHtml(r.type)}</code></td>
                    <td>${formatRichText(r.desc)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        ` : `<div class="card-body" style="color:var(--text-3);font-size:13.5px;">Endpoint ini tidak memiliki parameter path atau query.</div>`;
      } else if (state.reqTab === "headers") {
        const headers = [
          { key: "Accept", val: "application/json", note: "Wajib selalu" },
          ...(ep.body ? [{ key: "Content-Type", val: ep.contentType || "application/json", note: "Saat mengirim body" }] : []),
          ...(ep.auth ? [{ key: "Authorization", val: "Bearer {token} (atau cookie HttpOnly `sehatkita_token`)", note: "Autentikasi Sanctum" }] : []),
          ...(ep.extraHeaders || []).map((h) => ({ key: h.key, val: h.val, note: "Header khusus" }))
        ];
        reqContent = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Header</th><th>Nilai</th><th>Keterangan</th></tr></thead>
              <tbody>
                ${headers.map((h) => `
                  <tr>
                    <td><code>${escapeHtml(h.key)}</code></td>
                    <td>${formatRichText(h.val)}</td>
                    <td>${formatRichText(h.note)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (state.reqTab === "body") {
        if (!ep.body) {
          reqContent = `<div class="card-body" style="color:var(--text-3);font-size:13.5px;">Method <code class="inline-code">${ep.method}</code> pada endpoint ini tidak memerlukan request body.</div>`;
        } else if (ep.body._multipart) {
          reqContent = `
            <div class="card-body">
              <div class="callout" style="margin-top:0;">Endpoint ini memakai <code class="inline-code">multipart/form-data</code> (upload berkas).</div>
              <div class="code-box" style="margin-top:12px;">
                <div class="code-toolbar"><span>Payload Multipart</span></div>
                <pre class="code-pre">${highlightJson(ep.body)}</pre>
              </div>
            </div>
          `;

          reqContent = `
            <div class="code-box" style="border:none;border-radius:0;">
              <div class="code-toolbar">
                <span>JSON Payload (dapat diedit untuk Live Test)</span>
                <button type="button" class="copy-btn-mini" id="copyBodyBtn">Salin JSON</button>
              </div>
              <textarea class="code-editor" id="liveBodyEditor" spellcheck="false" aria-label="Editor JSON request body">${escapeHtml(bodyStr)}</textarea>
            </div>
          `;
        }
      } else {
        const curlStr = buildCurl(ep);
        reqContent = `
          <div class="code-box" style="border:none;border-radius:0;">
            <div class="code-toolbar">
              <span>cURL Command</span>
              <button type="button" class="copy-btn-mini" id="copyCurlBtn">Salin cURL</button>
            </div>
            <pre class="code-pre" id="curlPre">${escapeHtml(curlStr)}</pre>

            <strong>Hasil Live Request:</strong>

          </div>
          <button type="button" class="btn" id="clearLiveBtn" style="min-height:28px;padding:2px 10px;font-size:12px;">Kembali ke Contoh Kontrak</button>
        </div>
        <div class="code-box" style="border:none;border-radius:0;">
          <div class="code-toolbar"><span>Live Response Body</span></div>
          <pre class="code-pre">${typeof state.liveResult.body === "object" ? highlightJson(state.liveResult.body) : escapeHtml(state.liveResult.body)}</pre>
        </div>
      ` : `
        <div class="status-switcher" role="tablist" aria-label="Pilih contoh kode status HTTP">
          ${ep.responses.map((r) => `
            <button type="button" class="status-tab ${statusClass(r.code)} ${r.code === activeResp.code ? "active" : ""}" data-status-code="${r.code}">
              ${escapeHtml(r.label)}
            </button>
          `).join("")}
        </div>
        <div class="status-explain">
          <strong>HTTP ${activeResp.code}:</strong> ${formatRichText(activeResp.desc)}
        </div>
        <div class="code-box" style="border:none;border-radius:0;">
          <div class="code-toolbar">
            <span>Response Body (${activeResp.body._binary ? escapeHtml(activeResp.body.content_type) : "application/json"})</span>
            <button type="button" class="copy-btn-mini" id="copyRespBtn">Salin Response</button>
          </div>
          <pre class="code-pre">${highlightJson(activeResp.body)}</pre>
        </div>
      `;

      return `
        <article class="card">
          <div class="card-body">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
              <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;">
                ${escapeHtml(group.title)}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <span class="pill">${ep.auth ? "Auth: Bearer / Cookie" : "Publik (Tanpa Auth)"}</span>
                ${ep.rateLimit ? `<span class="pill">${escapeHtml(ep.rateLimit)}</span>` : ""}
                <button type="button" class="btn" id="toggleSplitBtn" style="min-height:26px;padding:2px 10px;font-size:11.5px;">
                  ${state.splitLayout ? "Tampilan Vertikal" : "Tampilan Berdampingan"}
                </button>
              </div>
            </div>

    async function sendLiveRequest(ep) {
      const base = $("#baseUrlSelect").value;
      const token = $("#tokenInput").value.trim();
      const headers = { Accept: "application/json" };
      if (ep.auth && token) {
        headers["Authorization"] = `Bearer ${token}`;
      }
      if (ep.extraHeaders) {
        for (const h of ep.extraHeaders) headers[h.key] = h.val;
      }

      const opts = { method: ep.method, headers, credentials: "include" };
      const editor = $("#liveBodyEditor");
      if (ep.body && !ep.body._multipart && ["POST", "PUT", "PATCH"].includes(ep.method)) {
        headers["Content-Type"] = "application/json";
        opts.body = editor ? editor.value : JSON.stringify(ep.body);
      }

      const url = `${base}${ep.path}`;
      const t0 = performance.now();
      try {
        const res = await fetch(url, opts);
        const ms = Math.round(performance.now() - t0);
        const text = await res.text();
        let parsed = text;
        try { parsed = JSON.parse(text); } catch (_) {}
        state.liveResult = { ok: res.ok, status: `${res.status} ${res.statusText}`, ms, body: parsed };
      } catch (err) {
        const ms = Math.round(performance.now() - t0);
        state.liveResult = {
          ok: false,
          status: "Network / CORS Error",
          ms,
          body: {
            keterangan: "Gagal terhubung ke server lokal dari browser.",
            penyebab_umum: [
              "Backend server belum dijalankan di Base URL terpilih.",
              "Jika dibuka lewat file://, browser memblokir CORS ke http://localhost atau http://sehatkita.test.",
              "Jika status 502 muncul saat proxy aktif, cek container sehatkita-backend / PHP-FPM."
            ],
            detail: String(err.message || err)
          }
        };
      }
      renderMain();
    }

    function getSchemaEdges() {
      const edges = [];
      for (const tbl of DB_SCHEMA) {
        for (const col of tbl.cols) {
          if (!col.fk) continue;
          const targetTable = col.fk.split(".")[0];
          edges.push({
            from: tbl.name,
            fromCol: col.name,
            to: targetTable,
            toCol: col.fk.split(".")[1] || "id",
            onDelete: col.onDelete || "RESTRICT"
          });
        }
      }
      return edges;
    }

    function getTableNodeHeight(tbl) {
      const shown = Math.min(tbl.cols.length, 6);
      const hasMore = tbl.cols.length > 6 ? 20 : 0;
      return 34 + shown * 19 + 14 + hasMore;
    }

      const pks = [];
      const fks = [];
      for (const c of tbl.cols) {
        let line = `  \`${c.name}\` ${c.type}`;
        if (c.nn) line += " NOT NULL";
        else line += " NULL";
        if (c.pk && c.name === "id") line += " AUTO_INCREMENT";
        if (c.def !== undefined) line += ` DEFAULT ${c.def}`;
        lines.push(line);
        if (c.pk) pks.push(`\`${c.name}\``);
        if (c.fk && c.onDelete && c.onDelete !== "LOGIS" && c.onDelete !== "POLYMORPHIC") {
          const [refTbl, refCol] = c.fk.split(".");
          fks.push(`  CONSTRAINT \`fk_${tbl.name}_${c.name}\` FOREIGN KEY (\`${c.name}\`) REFERENCES \`${refTbl}\` (\`${refCol}\`) ON DELETE ${c.onDelete}`);
        }
      }
      if (pks.length) lines.push(`  PRIMARY KEY (${pks.join(", ")})`);
      lines.push(...fks);
      return `CREATE TABLE \`${tbl.name}\` (\n${lines.join(",\n")}\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;`;
    }

    function buildMermaidErd() {
      const lines = ["erDiagram"];
      for (const e of getSchemaEdges()) {
        if (e.from === e.to) continue;
        lines.push(`  ${e.to} ||--o{ ${e.from} : "${e.fromCol} (${e.onDelete})"`);
      }
      return lines.join("\n");
    }

    function renderSchemaView() {
      const edges = getSchemaEdges();
      const totalCols = DB_SCHEMA.reduce((s, t) => s + t.cols.length, 0);
      const q = state.schemaSearch.toLowerCase().trim();

      const filteredTables = DB_SCHEMA.filter((t) => {
        const matchCluster = state.schemaCluster === "all" || t.cluster === state.schemaCluster;
        const matchSearch = !q ||
          t.name.toLowerCase().includes(q) ||
          t.desc.toLowerCase().includes(q) ||
          t.cols.some((c) => c.name.toLowerCase().includes(q) || c.type.toLowerCase().includes(q));
        return matchCluster && matchSearch;
      });

      const visibleNames = new Set(filteredTables.map((t) => t.name));
      const activeTbl = DB_SCHEMA.find((t) => t.name === state.activeTable) || filteredTables[0] || DB_SCHEMA[0];
      const outEdges = edges.filter((e) => e.from === activeTbl.name);
      const inEdges = edges.filter((e) => e.to === activeTbl.name);
      const relatedSet = new Set([activeTbl.name, ...outEdges.map((e) => e.to), ...inEdges.map((e) => e.from)]);

      const renderErdCanvas = () => {
        const tableMap = Object.fromEntries(DB_SCHEMA.map((t) => [t.name, t]));
        const svgPaths = edges.map((e) => {
          const src = tableMap[e.from];
          const dst = tableMap[e.to];
          if (!src || !dst) return "";
          const show = visibleNames.has(src.name) && visibleNames.has(dst.name);
          if (!show) return "";

          const isOut = e.from === activeTbl.name;
          const isIn = e.to === activeTbl.name;
          if (!state.showAllEdges && !isOut && !isIn) return "";

          const w = 236;
          const sh = getTableNodeHeight(src);
          const dh = getTableNodeHeight(dst);

          if (src.name === dst.name) {
            const sx = src.x + w;
            const sy = src.y + 34;
            const d = `M ${sx} ${sy} C ${sx + 38} ${sy - 26}, ${sx + 38} ${sy + 48}, ${sx} ${sy + 24}`;
            const cls = isOut ? "is-out" : "is-dim";
            return `<path class="erd-edge ${cls}" d="${d}" />`;
          }

          const sCx = src.x + w / 2;
          const dCx = dst.x + w / 2;
          const goRight = dCx >= sCx;
          const sx = Math.abs(dCx - sCx) < 40 ? sCx : (goRight ? src.x + w : src.x);
          const sy = src.y + Math.min(sh / 2, 72);
          const dx = Math.abs(dCx - sCx) < 40 ? dCx : (goRight ? dst.x : dst.x + w);
          const dy = dst.y + Math.min(dh / 2, 72);

          const dxSpan = Math.max(48, Math.abs(dx - sx) * 0.45);
          const c1x = Math.abs(dCx - sCx) < 40 ? sx + 40 : (goRight ? sx + dxSpan : sx - dxSpan);
          const c2x = Math.abs(dCx - sCx) < 40 ? dx + 40 : (goRight ? dx - dxSpan : dx + dxSpan);
          const d = `M ${sx} ${sy} C ${c1x} ${sy}, ${c2x} ${dy}, ${dx} ${dy}`;

          let cls = "";
          if (isOut) cls = "is-out";
          else if (isIn) cls = "is-in";
          else if (state.activeTable) cls = "is-dim";

          return `<path class="erd-edge ${cls}" d="${d}" />`;
        }).join("");

        const zonesHtml = Object.entries(SCHEMA_CLUSTERS).map(([key, meta]) => {
          if (state.schemaCluster !== "all" && state.schemaCluster !== key) return "";
          return `
            <div class="erd-zone ${meta.cls}" style="left:${meta.zone.x}px;top:${meta.zone.y}px;width:${meta.zone.w}px;height:${meta.zone.h}px;">
              <div class="erd-zone-label">${escapeHtml(meta.label)}</div>
            </div>
          `;
        }).join("");

        const nodesHtml = filteredTables.map((tbl) => {
          const cl = SCHEMA_CLUSTERS[tbl.cluster];
          const isActive = tbl.name === activeTbl.name;
          const isRelated = relatedSet.has(tbl.name);
          const cls = isActive ? "is-active" : (isRelated ? "is-related" : "is-dim");

          const keyCols = [
            ...tbl.cols.filter((c) => c.pk || c.fk),
            ...tbl.cols.filter((c) => !c.pk && !c.fk)
          ].slice(0, 6);
          const remain = tbl.cols.length - keyCols.length;

          return `
            <button type="button" class="erd-node ${cl.cls} ${cls}" data-select-table="${escapeHtml(tbl.name)}" style="left:${tbl.x}px;top:${tbl.y}px;">
              <div class="erd-node-head">
                <span class="erd-node-name">${escapeHtml(tbl.name)}</span>
                <span class="erd-node-count">${tbl.cols.length} kol</span>
              </div>
              <div class="erd-node-cols">
                ${keyCols.map((c) => `
                  <div class="erd-col-row">
                    <span class="erd-col-left">
                      ${c.pk ? '<span class="k-badge k-pk">PK</span>' : ""}
                      ${c.fk ? '<span class="k-badge k-fk">FK</span>' : ""}
                      <span class="erd-col-name">${escapeHtml(c.name)}</span>
                    </span>
                    <span class="erd-col-type">${escapeHtml(c.type.split("(")[0].replace(" UNSIGNED", "+"))}</span>
                  </div>
                `).join("")}
                ${remain > 0 ? `<div class="erd-more">+ ${remain} kolom lainnya...</div>` : ""}
              </div>
            </button>
          `;
        }).join("");

        return `
          <div class="erd-shell">
            <div class="erd-head">
              <div class="erd-legend">
                <strong>Kanvas ERD Interaktif</strong>
                <span><span class="cluster-dot" style="background:var(--primary)"></span> Mengacu ke (FK keluar)</span>
                <span><span class="cluster-dot" style="background:var(--accent)"></span> Diacu oleh (FK masuk)</span>
                <span class="pill">Klik tabel untuk sorot relasi &amp; detail</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <button type="button" class="btn" id="toggleEdgesBtn" style="min-height:30px;padding:3px 10px;font-size:12px;">
                  ${state.showAllEdges ? "Fokus Garis Aktif" : "Tampilkan Semua Garis"}
                </button>
                <button type="button" class="btn" id="zoomOutBtn" style="min-height:30px;padding:3px 10px;">-</button>
                <span class="mono" style="font-size:12px;min-width:44px;text-align:center;">${Math.round(state.erdZoom * 100)}%</span>
                <button type="button" class="btn" id="zoomInBtn" style="min-height:30px;padding:3px 10px;">+</button>
                <button type="button" class="btn" id="zoomResetBtn" style="min-height:30px;padding:3px 10px;font-size:12px;">Reset</button>
              </div>
            </div>
            <div class="erd-viewport" id="erdViewport">
              <div class="erd-stage" style="transform:scale(${state.erdZoom});">
                ${zonesHtml}
                <svg class="erd-svg" viewBox="0 0 1655 1220" aria-hidden="true">${svgPaths}</svg>
                ${nodesHtml}
              </div>
            </div>
          </div>
        `;
      };

      const renderCatalogGrid = () => `
        <div class="schema-grid">
          ${filteredTables.map((tbl) => {
            const cl = SCHEMA_CLUSTERS[tbl.cluster];
            const fkCount = tbl.cols.filter((c) => c.fk).length;
            const refByCount = edges.filter((e) => e.to === tbl.name).length;
            return `
              <button type="button" class="schema-card ${cl.cls} ${tbl.name === activeTbl.name ? "is-active" : ""}" data-select-table="${escapeHtml(tbl.name)}">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;">

                  <span class="cluster-pill ${cl.cls}">${escapeHtml(cl.label.split(",")[0])}</span>
                </div>
                <div style="font-size:12.5px;color:var(--text-2);line-height:1.45;">${formatRichText(tbl.desc)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;">
                  <span class="pill">${tbl.cols.length} kolom</span>
